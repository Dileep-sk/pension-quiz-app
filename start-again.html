<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pension Quiz</title>
    <link rel="stylesheet" href="./assets/style/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <section class="home min-h-screen w-full relative">


        <div class="relative z-10">
            <!-- Header -->
            <header class="bg-white/95 backdrop-blur-sm border-b border-white/20 px-8 py-4">
                <div class="max-w-7xl mx-auto flex items-center justify-between">
                    <div class="flex-1 text-center">
                        <h1 class="text-2xl font-bold text-[#00a651]">Pension Quiz</h1>
                        <p class="text-sm text-[#0070c0]">brew your knowledge about pension</p>
                    </div>
                    <button class="h-8 px-3 rounded-md bg-white/95 border border-white/30 hover:bg-[#00a651]/10">
                        <img src="./assets/images/language.svg" alt="Language" />
                    </button>
                </div>
            </header>

            <!-- Main -->
            <main class="container mx-auto px-8 py-8 max-w-4xl">
                <div data-slot="card"
                    class="text-card-foreground !bg-[#fff] flex flex-col gap-6 rounded-xl border p-8 bg-white/95 backdrop-blur-sm border-white/30 shadow-xl max-w-2xl mx-auto">
                    <div class="text-center space-y-6">
                        <div class="space-y-4">
                            <div
                                class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-gradient-to-br from-[#00a651] to-[#0070c0] text-white">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="lucide lucide-target w-10 h-10" aria-hidden="true">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <circle cx="12" cy="12" r="6"></circle>
                                    <circle cx="12" cy="12" r="2"></circle>
                                </svg>
                            </div>
                            <div>
                                <h2 class="text-3xl font-bold text-gray-800 mb-2">Quiz Completed!</h2>
                                <p class="text-lg text-gray-600">Time to brush up on your pension knowledge!</p>
                            </div>
                        </div>
                        <div class="bg-gradient-to-r from-[#00a651]/10 to-[#0070c0]/10 rounded-lg p-6">
                            <div class="grid grid-cols-3 gap-4 text-center">
                                <div>
                                    <div class="text-3xl font-bold text-[#00a651]">2</div>
                                    <div class="text-sm text-gray-600">Correct</div>
                                </div>
                                <div>
                                    <div class="text-3xl font-bold text-[#0070c0]">6</div>
                                    <div class="text-sm text-gray-600">Total</div>
                                </div>
                                <div>
                                    <div class="text-3xl font-bold text-orange-600">33%</div>
                                    <div class="text-sm text-gray-600">Score</div>
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-col sm:flex-row gap-4 items-center justify-center"><a href="./quiz.html"
                                class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*='size-'])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive hover:bg-primary/90 h-9 has-[&gt;svg]:px-3 bg-gradient-to-r from-[#00a651] to-[#0070c0] hover:from-[#008a45] hover:to-[#005a9f] text-white px-8 py-3">
                                <img src="./assets/images/reload.svg" class="w-[16px]  " alt="">
                                Start Again</a></div>
                        <div class="border-t border-gray-200 pt-6">
                            <div class="bg-white/95 backdrop-blur-sm rounded-lg p-6 border border-white/30 text-center">
                                <h3 class="font-semibold text-gray-800 mb-2">Want to learn more about pensions?</h3>
                                <p class="text-sm text-gray-600 mb-4">Scan for personal pension advice and more
                                    information</p>
                                <div class="inline-block p-4 bg-white rounded-lg shadow-sm">

                                    <img class="w-[120px]" src="./assets/images/qr.png" alt="">
                                </div>
                                <p class="text-xs text-gray-500 mt-2">Scan met je telefoon</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </section>
</body>

</html>
